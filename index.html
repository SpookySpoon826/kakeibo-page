<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿アプリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>家計簿</h1>
    <h2>家計簿をつけましょう</h2>
  </header>

  <main>
    <section aria-labelledby="entry-heading">
      <h2 id="entry-heading">データを登録しましょう</h2>
      <form action="#" method="get">
        <p>
          <label for="entry-date">日付</label>
          <input type="date" id="entry-date" name="date" required>
        </p>
        <p>
          <label for="entry-item">品目</label>
          <input type="text" id="entry-item" name="item" placeholder="例：飲食代" required>
        </p>
        <p>
          <label for="entry-type">支出・収入</label>
          <select id="entry-type" name="type" required>
            <option value="expense">支出</option>
            <option value="income">収入</option>
          </select>
        </p>
        <p>
          <label for="entry-amount">金額（円）</label>
          <input type="number" id="entry-amount" name="amount" min="1" step="1" placeholder="例：1000" required>
        </p>
        <button type="submit">登録</button>
      </form>
      <p id="app-status" class="app-status" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">登録データ一覧</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">日付</th>
            <th scope="col">品目</th>
            <th scope="col">支出・収入</th>
            <th scope="col">金額</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </section>

    <section aria-labelledby="total-heading">
      <h2 id="total-heading">合計金額</h2>
      <p id="total-amount">0円</p>
    </section>
  </main>
</body>
</html>
